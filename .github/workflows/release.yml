name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            # The mac target ships two arches from one arm64 runner, so the
            # x64 voice runtime has to be fetched: npm installs only the
            # binaries of the machine it runs on, and a missing one degrades
            # to the OS voice without a word.
            runtime: darwin arm64 x64
          - os: windows-latest
            platform: win
            runtime: win x64
          # 22.04 rather than ubuntu-latest: 24.04's unprivileged-userns
          # restriction is what the installer has to cope with on a real
          # desktop, and a build runner should not be guessing about it.
          - os: ubuntu-22.04
            platform: linux
            runtime: linux x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: bundle
        run: npm run build

      # The neural voice is a native optionalDependency per platform/arch, so
      # a runner that packages for another arch would otherwise ship an app
      # whose Matcha engine cannot load - quietly, because every line of it
      # falls back to the OS voice. Same reason the local dist:* scripts run it.
      - name: voice runtime for the target
        run: node scripts/ensure-voice-runtime.mjs ${{ matrix.runtime }}

      - name: package (mac)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never

      - name: package (win)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never

      - name: package (linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never

      # A packaged binary that cannot print its own help text is not a build, it
      # is a pile of bytes. This is the only gate that catches a missing native
      # dependency, a broken asar layout or a sandbox abort -- and for Windows
      # it is the only automated runtime check this project has.
      - name: smoke (win)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          exe=$(ls release/win-unpacked/*.exe | head -1)
          "$exe" --cli help
          "$exe" --cli status --json

      - name: smoke (linux)
        if: matrix.platform == 'linux'
        run: |
          # Electron brings up the display platform before any of our JS runs,
          # so a headless runner gets "The platform failed to initialize"
          # instead of the help text. xvfb-run is preinstalled on the image.
          # APPIMAGE_EXTRACT_AND_RUN=1: runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a ./release/*linux*.AppImage \
            --appimage-extract-and-run --cli help
          # And the deb's payload, which is what `sudo apt install ./deb` ships.
          dpkg-deb -x ./release/*linux*.deb /tmp/debroot
          bin=$(find /tmp/debroot -type f -name codewaifu | head -1)
          test -n "$bin"
          xvfb-run -a "$bin" --cli help

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: list artifacts
        run: ls -la release

      # Linux and Windows ship from this run. The mac artifacts stay in CI:
      # they are unsigned and no mac has ever opened them, so the mac release
      # is a human on a mac attaching them after a manual pass
      # (docs/RELEASE.md). Building them here still matters - it is the only
      # compile-and-package check the mac target gets.
      - name: drop the mac artifacts from the publish set
        run: |
          shopt -s nullglob
          for f in release/*-mac-* release/*.dmg release/latest-mac.yml; do
            rm -f -- "$f"
          done
          ls -la release

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent on purpose: a maintainer may already have opened the
          # release from a local build so early adopters get artifacts before
          # CI finishes. Create only when missing, then always upload --clobber
          # so the tag ends up with exactly the CI-built files.
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "CodeWaifu ${GITHUB_REF_NAME}" \
              --generate-notes \
              $([ "${GITHUB_REF_NAME}" = "${GITHUB_REF_NAME#*-}" ] || echo --prerelease)
          fi
          gh release upload "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" --clobber
