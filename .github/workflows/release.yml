name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to publish, e.g. v0.4.12 - empty builds all three platforms and publishes nothing'
        required: false
        default: ''
      publish_mac:
        description: 'attach the CI-built mac artifacts too'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            # The mac target ships two arches from one arm64 runner, so the
            # x64 voice runtime has to be fetched: npm installs only the
            # binaries of the machine it runs on, and a missing one degrades
            # to the OS voice without a word.
            runtime: darwin arm64 x64
          - os: windows-latest
            platform: win
            runtime: win x64
          # 22.04 rather than ubuntu-latest: 24.04's unprivileged-userns
          # restriction is what the installer has to cope with on a real
          # desktop, and a build runner should not be guessing about it.
          - os: ubuntu-22.04
            platform: linux
            runtime: linux x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: bundle
        run: npm run build

      # The neural voice is a native optionalDependency per platform/arch, so
      # a runner that packages for another arch would otherwise ship an app
      # whose Matcha engine cannot load - quietly, because every line of it
      # falls back to the OS voice. Same reason the local dist:* scripts run it.
      - name: voice runtime for the target
        run: node scripts/ensure-voice-runtime.mjs ${{ matrix.runtime }}

      - name: package (mac)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never

      - name: package (win)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never

      - name: package (linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never

      # A packaged binary that cannot print its own help text is not a build, it
      # is a pile of bytes. This is the only gate that catches a missing native
      # dependency, a broken asar layout or a sandbox abort -- and for Windows
      # it is the only automated runtime check this project has.
      - name: smoke (win)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          exe=$(ls release/win-unpacked/*.exe | head -1)
          "$exe" --cli help
          "$exe" --cli status --json

      - name: smoke (linux)
        if: matrix.platform == 'linux'
        run: |
          # Electron brings up the display platform before any of our JS runs,
          # so a headless runner gets "The platform failed to initialize"
          # instead of the help text. xvfb-run is preinstalled on the image.
          # APPIMAGE_EXTRACT_AND_RUN=1: runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a ./release/*linux*.AppImage \
            --appimage-extract-and-run --cli help
          # And the deb's payload, which is what `sudo apt install ./deb` ships.
          dpkg-deb -x ./release/*linux*.deb /tmp/debroot
          bin=$(find /tmp/debroot -type f -name codewaifu | head -1)
          test -n "$bin"
          xvfb-run -a "$bin" --cli help

      - name: smoke (mac)
        if: matrix.platform == 'mac'
        run: |
          # The same question the other two ask: does the packaged binary run,
          # or is it a pile of bytes with a native module missing inside. Mac
          # ships from CI whenever a maintainer cannot push 435 MB up a bad
          # uplink (docs/RELEASE.md), and this is the only gate those bytes get.
          # No xvfb business: a macOS runner has a real window server session.
          bin=release/mac-arm64/CodeWaifu.app/Contents/MacOS/CodeWaifu
          test -x "$bin"
          "$bin" --cli help
          "$bin" --cli status --json

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    # A tag push carries its own name in the ref. A dispatch runs on a branch,
    # so the tag it should publish has to be said out loud - and a dispatch with
    # no tag at all is a build check: three platforms compiled, packaged and
    # smoked, with nothing attached to any release.
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: list artifacts
        run: ls -la release

      # Updater metadata. The published mac set is three files - arm64 dmg plus
      # arm64 and x64 zips - and this is not one of them, so it goes whether or
      # not mac ships from this run.
      - name: drop latest-mac.yml
        run: rm -f release/latest-mac.yml

      # Linux and Windows ship from every run. The mac artifacts ship only when
      # a maintainer asks for them on a dispatch, because they are unsigned and
      # no mac has opened them: the normal mac release is a person on a mac
      # attaching the build they verified by hand (docs/RELEASE.md). The escape
      # hatch exists because 435 MB over a bad uplink is not a release plan -
      # v0.4.12 went this way after the local proxy reset mid-upload for an
      # hour at ~100 KB/s. Building them here matters either way: it is the
      # only compile-and-package check the mac target gets.
      - name: drop the mac artifacts from the publish set
        if: ${{ !inputs.publish_mac }}
        run: |
          shopt -s nullglob
          for f in release/*-mac-* release/*.dmg; do
            rm -f -- "$f"
          done
          ls -la release

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent on purpose: a maintainer may already have opened the
          # release from a local build so early adopters get artifacts before
          # CI finishes. Create only when missing, then always upload --clobber
          # so the tag ends up with exactly the CI-built files.
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "CodeWaifu ${TAG}" \
              --generate-notes \
              $([ "${TAG}" = "${TAG#*-}" ] || echo --prerelease)
          fi
          gh release upload "${TAG}" release/* \
            --repo "${GITHUB_REPOSITORY}" --clobber
