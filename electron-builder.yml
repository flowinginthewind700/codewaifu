appId: top.robotworld.codewaifu
productName: CodeWaifu
copyright: Copyright (c) 2026 flowinginthewind700
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - plugin/**/*
  - LICENSE
  # The neural voice is native code, not something `out/` can carry. Two halves
  # have to ride along: the sherpa-onnx binary package, which is where
  # `libsherpa-onnx-c-api` lives, and koffi, which is how the main process calls
  # it (see src/main/matchaNative.ts for why the official Node addon cannot be
  # used inside Electron at all).
  - node_modules/sherpa-onnx-node/**/*
  - node_modules/sherpa-onnx-*/**/*
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*
asar: true
asarUnpack:
  - 'plugin/**'
  # dlopen cannot read out of an asar, and both the sherpa C API and koffi's own
  # addon resolve their siblings relative to themselves (@loader_path rpath for
  # the dylibs, a `./<triplet>/koffi.node` require for koffi), so each package
  # has to land on real disk with its layout intact.
  - 'node_modules/sherpa-onnx-*/**'
  - 'node_modules/koffi/**'
  - 'node_modules/@koromix/**'
npmRebuild: false
# A mac build machine usually holds both arch flavours of every native package;
# the hook drops the ones this target cannot load.
afterPack: ./scripts/after-pack.mjs
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  target:
    - target: zip
      arch:
        - arm64
        - x64
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: CodeWaifu
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  # Wayland matches a window to its launcher entry by app_id, which Electron
  # takes from desktopName in package.json. Without the sync the dock keeps a
  # second generic icon while the companion is running.
  syncDesktopName: true
  # Mandatory for the deb: without an address electron-builder writes the npm
  # author into the Maintainer field and dpkg complains on install.
  maintainer: flowinginthewind700 <flowinginthewind700@users.noreply.github.com>
  synopsis: Desktop companion for Codex and Claude Code
  desktop:
    entry:
      # The window's WM_CLASS, so the launcher icon groups with the running
      # companion instead of spawning a second generic entry in the dock.
      # Electron derives it from the executable name; verified with xprop.
      StartupWMClass: codewaifu
      StartupNotify: 'true'
      Terminal: 'false'
      Keywords: codex;claude;agent;companion;live2d;
      # GNOME only shows notification icons for apps that declare this.
      X-GNOME-UsesNotifications: 'true'
publish:
  provider: github
  owner: flowinginthewind700
  repo: codewaifu
