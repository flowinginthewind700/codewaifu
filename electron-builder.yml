appId: top.robotworld.codewaifu
productName: CodeWaifu
copyright: Copyright (c) 2026 flowinginthewind700
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - plugin/**/*
  - LICENSE
asar: true
asarUnpack:
  - 'plugin/**'
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  target:
    - target: zip
      arch:
        - arm64
        - x64
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: CodeWaifu
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
linux:
  target:
    - AppImage
  category: Development
publish:
  provider: github
  owner: flowinginthewind700
  repo: codewaifu
