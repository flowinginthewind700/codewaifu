appId: top.robotworld.codewaifu
productName: CodeWaifu
copyright: Copyright (c) 2026 flowinginthewind700
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - plugin/**/*
  - LICENSE
  # The neural voice is native code, not something `out/` can carry. Two halves
  # have to ride along: the sherpa-onnx binary package, which is where
  # `libsherpa-onnx-c-api` lives, and koffi, which is how the main process calls
  # it (see src/main/matchaNative.ts for why the official Node addon cannot be
  # used inside Electron at all).
  - node_modules/sherpa-onnx-node/**/*
  - node_modules/sherpa-onnx-*/**/*
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*
asar: true
asarUnpack:
  - 'plugin/**'
  # dlopen cannot read out of an asar, and both the sherpa C API and koffi's own
  # addon resolve their siblings relative to themselves (@loader_path rpath for
  # the dylibs, a `./<triplet>/koffi.node` require for koffi), so each package
  # has to land on real disk with its layout intact.
  - 'node_modules/sherpa-onnx-*/**'
  - 'node_modules/koffi/**'
  - 'node_modules/@koromix/**'
npmRebuild: false
# A mac build machine usually holds both arch flavours of every native package;
# the hook drops the ones this target cannot load.
afterPack: ./scripts/after-pack.mjs
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  target:
    - target: zip
      arch:
        - arm64
        - x64
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: CodeWaifu
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
linux:
  target:
    - AppImage
  category: Development
publish:
  provider: github
  owner: flowinginthewind700
  repo: codewaifu
